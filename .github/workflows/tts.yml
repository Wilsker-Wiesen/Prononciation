# Erzeugt Vorbild-Aufnahmen für die eigenen Inhalte der App mit neuronaler Sprachsynthese
# und prüft jede Aufnahme mit dem französischen Phonem-Erkenner.
# Start: Actions → "Vorbildstimme erzeugen" → "Run workflow".
#   mode = sample: kurze Hörproben aller Kandidatenstimmen (Release tts-samples)
#   mode = full:   alle Texte mit einer Stimme (Release tts-v1, danach nach public/tts übernehmen)
name: Vorbildstimme erzeugen

on:
  workflow_dispatch:
    inputs:
      mode:
        description: sample oder full
        default: sample
      voice:
        description: Nur bei full – Stimmen-ID(s) aus der Matrix, durch Komma getrennt (z. B. piper-siwis-medium,kokoro-ff-siwis)
        default: piper-siwis-medium

permissions:
  contents: write

jobs:
  synth:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nicht aufgenommen: tom (Trainingsdaten AGPLv3), gilles (Prüfung 59,6 Punkte)
          - { id: piper-siwis-medium, engine: piper, path: siwis/medium/fr_FR-siwis-medium, credit: 'Piper-Stimme fr_FR-siwis-medium, trainiert auf der SIWIS French Speech Synthesis Database (University of Edinburgh, CC BY 4.0)' }
          - { id: piper-upmc-jessica, engine: piper, path: upmc/medium/fr_FR-upmc-medium, speaker: 0, credit: 'Piper-Stimme fr_FR-upmc-medium (jessica), Trainingsdaten UPMC/MaryTTS (CC BY-SA 4.0)' }
          - { id: piper-upmc-pierre, engine: piper, path: upmc/medium/fr_FR-upmc-medium, speaker: 1, credit: 'Piper-Stimme fr_FR-upmc-medium (pierre), Trainingsdaten UPMC/MaryTTS (CC BY-SA 4.0)' }
          - { id: kokoro-ff-siwis, engine: kokoro, kvoice: ff_siwis, credit: 'Kokoro-82M (Apache 2.0), Stimme ff_siwis, trainiert auf der SIWIS French Speech Synthesis Database (CC BY 4.0)' }
    steps:
      - name: Stimme überspringen (full nur für die gewählte)
        id: gate
        run: |
          # voice darf eine Komma-Liste sein, z. B. "piper-siwis-medium,kokoro-ff-siwis"
          if [ "${{ inputs.mode }}" = "full" ] && [[ ",${{ inputs.voice }}," != *",${{ matrix.id }},"* ]]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: ${{ !steps.gate.outputs.skip }}
      - uses: actions/setup-node@v4
        if: ${{ !steps.gate.outputs.skip }}
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: ${{ !steps.gate.outputs.skip }}
        with:
          python-version: '3.11'
      - name: Abhängigkeiten
        if: ${{ !steps.gate.outputs.skip }}
        run: |
          npm ci
          npm install --no-save onnxruntime-node
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          if [ "${{ matrix.engine }}" = "piper" ]; then
            pip install --quiet piper-tts
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install "kokoro>=0.9" soundfile numpy phonemizer-fork espeakng-loader
            python3 -c "import torch, kokoro; print('torch', torch.__version__)"
          fi
      - name: Textliste
        if: ${{ !steps.gate.outputs.skip }}
        run: |
          mkdir -p out
          npx tsx tools/tts-texts.ts out/texts.json ${{ inputs.mode == 'sample' && '--sample' || '' }}
      - name: Piper-Stimme laden (mit Modellkarte)
        if: ${{ !steps.gate.outputs.skip && matrix.engine == 'piper' }}
        run: |
          set -e
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/${{ matrix.path }}"
          dir=$(dirname "${{ matrix.path }}")
          curl -fsSL "$base.onnx" -o voice.onnx
          curl -fsSL "$base.onnx.json" -o voice.onnx.json
          curl -fsSL "https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/$dir/MODEL_CARD" -o out/MODEL_CARD.txt || echo "keine Modellkarte" > out/MODEL_CARD.txt
          cat out/MODEL_CARD.txt
          python3 -c "import json; c=json.load(open('voice.onnx.json')); print('Sprecher:', c.get('speaker_id_map')); print('Rate:', c['audio']['sample_rate'])"
      - name: Kokoro-Hinweis
        if: ${{ !steps.gate.outputs.skip && matrix.engine == 'kokoro' }}
        run: |
          curl -fsSL "https://huggingface.co/hexgrad/Kokoro-82M/resolve/main/VOICES.md" -o out/MODEL_CARD.txt || true
          grep -i -A3 -B3 "ff_siwis\|french" out/MODEL_CARD.txt || true
      - name: Synthese (drei Sprechtempi)
        if: ${{ !steps.gate.outputs.skip }}
        run: |
          set -e
          for slow in 1.0 1.15 1.3; do
            if [ "${{ matrix.engine }}" = "piper" ]; then
              python3 tools/tts-synth.py --texts out/texts.json --out out/v$slow/wav --engine piper --model voice.onnx --slow $slow ${{ matrix.speaker != '' && format('--speaker {0}', matrix.speaker) || '' }} > /dev/null
            else
              python3 tools/tts-synth.py --texts out/texts.json --out out/v$slow/wav --engine kokoro --voice ${{ matrix.kvoice }} --slow $slow > /dev/null
            fi
            echo "Tempo $slow: $(ls out/v$slow/wav | wc -l) Dateien"
          done
      - name: Prüfung mit dem Phonem-Erkenner und Auswahl der besten Fassung
        if: ${{ !steps.gate.outputs.skip }}
        run: |
          set -e
          rel="https://github.com/${{ github.repository }}/releases/download/models-v1"
          curl -fsSL "$rel/wav2vec2-french-phonemizer.onnx" -o fr.onnx
          curl -fsSL "$rel/wav2vec2-french-phonemizer.vocab.json" -o fr.vocab.json
          for slow in 1.0 1.15 1.3; do
            npx tsx tools/validate-model.mjs --model fr.onnx --vocab fr.vocab.json --audio-dir out/v$slow/wav --manifest out/texts.json --report out/v$slow/report.json --min-mean 0 2>&1 | grep -v '^var ' > out/v$slow/report.txt
            echo "Tempo $slow: $(tail -1 out/v$slow/report.txt)"
          done
          python3 tools/tts-pick.py --texts out/texts.json --out out/final --min 80 out/v1.0 out/v1.15 out/v1.3 | tee out/auswahl.txt
      - name: MP3 kodieren und packen
        if: ${{ !steps.gate.outputs.skip }}
        env:
          CREDIT: ${{ matrix.credit }}
        run: |
          set -e
          mkdir -p out/tts
          for f in out/final/wav/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -af "silenceremove=start_periods=1:start_threshold=-50dB,areverse,silenceremove=start_periods=1:start_threshold=-50dB,areverse,adelay=80,apad=pad_dur=0.15" -ac 1 -ar 24000 -b:a 48k "out/tts/$(basename "$f" .wav).mp3"
          done
          python3 - <<'PY'
          import json, os, re, shutil
          rows = json.load(open('out/texts.json', encoding='utf-8'))
          files = {r['key']: r['key'] + '.mp3' for r in rows if os.path.exists(f"out/tts/{r['key']}.mp3")}
          json.dump({'voice': '${{ matrix.id }}', 'credit': os.environ['CREDIT'], 'format': 'mp3', 'files': files},
                    open('out/tts/manifest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=0)
          if '${{ inputs.mode }}' == 'sample':
              os.makedirs('out/hoerproben', exist_ok=True)
              for i, r in enumerate(rows):
                  name = re.sub(r"[^\w' -]", '', r['text'], flags=re.U).strip()[:40]
                  shutil.copy(f"out/tts/{r['key']}.mp3", f"out/hoerproben/{i+1:02d} {name}.mp3")
          PY
          cp out/final/auswahl.json out/final/pruefliste.txt out/
          for slow in 1.0 1.15 1.3; do cp out/v$slow/report.txt "out/report-tempo-$slow.txt"; done
          extra=""; [ -d out/hoerproben ] && extra="hoerproben"
          (cd out && zip -qr "../${{ matrix.id }}.zip" tts report-tempo-*.txt auswahl.txt auswahl.json pruefliste.txt texts.json MODEL_CARD.txt $extra)
          ls -la *.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !steps.gate.outputs.skip }}
        with:
          name: ${{ matrix.id }}
          path: ${{ matrix.id }}.zip

  release:
    needs: synth
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=${{ inputs.mode == 'full' && 'tts-v1' || 'tts-samples' }}
          files=$(find assets -name '*.zip')
          echo "$files"
          test -n "$files"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --yes --cleanup-tag || true; sleep 5; fi
          gh release create "$TAG" $files --title "Vorbildstimme $TAG" --notes "Synthetische Vorbild-Aufnahmen für die eigenen Inhalte der App, geprüft mit dem Phonem-Erkenner (report.txt je Stimme)." --prerelease
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
